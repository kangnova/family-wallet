services:
  db:
    image: postgres:15-alpine
    container_name: family-wallet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-family_wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-family_wallet_dev}
      POSTGRES_DB: ${POSTGRES_DB:-family_wallet}
    ports:
      - "5433:5432"
    volumes:
      - family_wallet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-family_wallet} -d ${POSTGRES_DB:-family_wallet}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  family_wallet_pgdata:
